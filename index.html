<body>
<canvas id="c"></canvas>

<script>
(()=>{
'use strict';

/* ====== НАСТРОЙКИ — меняй тут ====== */
const CONFIG = {
  title: 'для тебя ♥',                 // большая подпись внизу
  sub:   'цветы, которые не вянут',    // маленькая строка под ней
  hint:  'крути пальцем · щипок — приблизить',
  autoSpin: 0.32                        // скорость авто-вращения
};
/* =================================== */

const $=id=>document.getElementById(id);
$('t').textContent=CONFIG.title;
$('s').textContent=CONFIG.sub;
const cv=$('c'), ctx=cv.getContext('2d');

/* ---------- палитра (цвет × 8 уровней яркости) ---------- */
const LV=8, PAL=[], PMAP={};
function P(hex){
  if(PMAP[hex]!==undefined) return PMAP[hex];
  const h=hex.replace('#','');
  const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  const arr=[];
  for(let l=0;l<LV;l++){
    const t=l/(LV-1); let R,G,B;
    if(t<0.6){const k=0.4+0.6*(t/0.6); R=r*k;G=g*k;B=b*k;}
    else{const k=(t-0.6)/0.4*0.45; R=r+(255-r)*k;G=g+(255-g)*k;B=b+(255-b)*k;}
    arr.push('rgb('+(R|0)+','+(G|0)+','+(B|0)+')');
  }
  PAL.push(arr); return PMAP[hex]=PAL.length-1;
}
const C={
  leaf:P('#46d058'), leaf2:P('#2a9a48'), stem:P('#72e26c'), sepal:P('#3dbb5a'),
  ribbon:P('#ff6fa8'), white:P('#f4f4ff'), cream:P('#ffe8a4'), yellow:P('#ffc928'),
  red:P('#ff3a3a'), redDeep:P('#9a0a24'), dark:P('#3a1240'),
  pink:P('#ff7ac0'), pinkDeep:P('#ff3d97'), purple:P('#b57bff'), violet:P('#7a3df0'),
  orange:P('#ff9a3c'), orangeDeep:P('#e8561a'), blue:P('#5f86ff'), blueLight:P('#a4b9ff'),
  butter:P('#ffd21f'), butterDeep:P('#f09a10'), lav:P('#a98bff'), lavDeep:P('#6a3fe0'),
  fall:P('#ffb3d1'), spark:P('#fff2b0'), star:P('#8fa0d8'),
  crimson:P('#e61e4d'), crimsonDeep:P('#8a0a2a'), blush:P('#ffc7dc'), blueDeep:P('#3a52e0')
};

const RAMP=['8','#','0','@'], NR=RAMP.length;

/* ---------- сетка символов ---------- */
let W,H,DPR,cols,rows,cw,ch,fs,aspect,zb,cellPal,cellCh,head,nxt,Sc0;
const ALPHAS=[1,0.6,0.3];
let PK=1;   // во сколько клеток рисуем «точки» (звёзды, искры), чтобы на мелкой сетке они не пропадали
let QUAL=1;   // 0.5..1 — подстраивается под скорость устройства
const INF=1e9;
function resize(){
  W=innerWidth||document.documentElement.clientWidth||360; H=innerHeight||document.documentElement.clientHeight||640;
  // детализация одинакова на любом устройстве: поперёк букета всегда ≥240 символов (на телефоне символы просто мельче)
  const B=Math.min(W*0.96,H*0.8);           // сторона квадрата, в который вписан букет
  const N=Math.max(100,Math.min(300,Math.round(Math.max(240,B/3.4)*QUAL)));
  cw=B/N; PK=Math.max(1,Math.min(3,Math.round(3.2/cw)));
  // мелкие символы на плотном экране телефона рисуем в полном разрешении экрана, иначе буквы-«кубики» расплываются
  DPR=parseFloat(new URLSearchParams(location.search).get('dpr'))||Math.min(window.devicePixelRatio||1, cw<3?3:2);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  fs=cw/0.6;
  ctx.font='bold '+fs+'px ui-monospace,Menlo,Consolas,"Courier New",monospace';
  const m=ctx.measureText('0').width||fs*0.6;
  fs*=cw/m;
  ctx.font='bold '+fs+'px ui-monospace,Menlo,Consolas,"Courier New",monospace';
  ch=fs*1.12; cols=Math.floor(W/cw); rows=Math.floor(H/ch); aspect=ch/cw;
  zb=new Float32Array(cols*rows); cellPal=new Int16Array(cols*rows); cellCh=new Uint8Array(cols*rows);
  head=new Int32Array(PAL.length*LV*3); nxt=new Int32Array(cols*rows);
  Sc0=N/3.5;
  ctx.textBaseline='top';
}

/* ---------- камера / вращение ---------- */
const CAM=6.2;
const PITCH0=0.5;
let yaw=0, pitch=PITCH0, yawV=CONFIG.autoSpin, zoom=1, idleT=0;
let m0,m1,m2,m3,m4,m5,m6,m7,m8, cx,cy, Sc, Lw0,Lw1,Lw2;

function setCamera(){
  const cY=Math.cos(yaw), sY=Math.sin(yaw), cP=Math.cos(pitch), sP=-Math.sin(pitch);
  m0=cY;      m1=0;   m2=sY;
  m3=sP*sY;   m4=cP;  m5=-sP*cY;
  m6=-cP*sY;  m7=sP;  m8=cP*cY;
  cx=cols/2; cy=rows*0.45; Sc=Sc0*zoom;
  // свет в пространстве камеры -> в мировое
  const lx=-0.35, ly=0.6, lz=-0.72, ln=Math.hypot(lx,ly,lz);
  const Lx=lx/ln, Ly=ly/ln, Lz=lz/ln;
  Lw0=m0*Lx+m3*Ly+m6*Lz; Lw1=m1*Lx+m4*Ly+m7*Lz; Lw2=m2*Lx+m5*Ly+m8*Lz;
}

function plot(X,Y,Z,pi,b,al,gl){
  const x=m0*X+m1*Y+m2*Z, y=m3*X+m4*Y+m5*Z, z=m6*X+m7*Y+m8*Z;
  const d=CAM+z; if(d<1) return;
  const f=CAM/d;
  const sx=(cx+x*f*Sc)|0, sy=(cy-y*f*Sc/aspect)|0;
  if(sx<0||sx>=cols||sy<0||sy>=rows) return;
  const i=sy*cols+sx;
  if(d>=zb[i]) return;
  if(b<0)b=0; else if(b>1)b=1;
  zb[i]=d; cellPal[i]=(pi*LV+((b*(LV-0.01))|0))*3+(al|0); cellCh[i]=gl>=0?gl:(b>0.92?3:0);
}
// звёзды не должны быть «.» ярче всего


/* ---------- детерминированный рандом ---------- */
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry(11);

/* ---------- типы цветов ---------- */
const TYPES={
  daisy:{ rings:[{n:13,l:.31,w:.027,as:1,off:0},{n:13,l:.25,w:.025,as:.82,off:.24}],
          shape:.8,cup:.05,aC:.10,aO:1.42,bend:-.12,pA:C.white,pB:C.cream,pC:C.yellow,cR:.11,dome:.07,size:1.15},
  poppy:{ rings:[{n:4,l:.31,w:.17,as:1,off:.4},{n:4,l:.27,w:.15,as:.8,off:.4+Math.PI/4}],
          shape:1.25,cup:.55,aC:.10,aO:.95,bend:-.32,pA:C.red,pB:C.redDeep,pC:C.dark,cR:.095,dome:.07,size:1.05},
  cosmos:{rings:[{n:8,l:.31,w:.078,as:1,off:0},{n:8,l:.24,w:.07,as:.8,off:Math.PI/8}],
          shape:1.0,cup:.2,aC:.12,aO:1.3,bend:-.1,pA:C.pink,pB:C.pinkDeep,pC:C.yellow,cR:.05,dome:.04,size:1.0},
  corn:{  rings:[{n:13,l:.28,w:.03,as:1,off:0},{n:11,l:.22,w:.028,as:.78,off:.25}],
          shape:.7,cup:.1,aC:.12,aO:1.25,bend:.08,pA:C.blue,pB:C.violet,pC:C.violet,cR:.05,dome:.07,size:1.0},
  butter:{rings:[{n:5,l:.19,w:.085,as:1,off:.3},{n:5,l:.15,w:.075,as:.75,off:.3+Math.PI/5}],
          shape:1.15,cup:.45,aC:.12,aO:1.0,bend:-.3,pA:C.butter,pB:C.butterDeep,pC:C.orangeDeep,cR:.035,dome:.03,size:1.0}
};
const COSMOS_VAR=[[C.pink,C.pinkDeep,C.yellow],[C.purple,C.violet,C.yellow],[C.orange,C.orangeDeep,C.dark],[C.white,C.pink,C.yellow]];
const POPPY_VAR=[[C.red,C.redDeep,C.dark],[C.orange,C.orangeDeep,C.dark]];

/* ---------- расположение цветов [тип, x, y, z, вариант] ---------- */
const LAYOUT=[
  ['poppy',0.0,1.12,0.0,0],
  ['daisy',0.66,0.92,0.1],
  ['cosmos',0.2,0.88,0.7,0],
  ['corn',-0.58,0.98,0.35],
  ['butter',-0.45,0.9,-0.52],
  ['cosmos',0.36,0.98,-0.62,1],
  ['poppy',1.12,0.42,0.22,1],
  ['daisy',0.82,0.32,0.88],
  ['corn',-0.2,0.3,1.16],
  ['cosmos',-1.06,0.44,0.5,3],
  ['daisy',-1.12,0.36,-0.46],
  ['butter',-0.2,0.42,-1.12],
  ['corn',0.82,0.38,-0.92],
  ['cosmos',0.55,0.5,0.55,2],
  ['spike',-0.9,1.32,-0.15],
  ['spike',0.82,1.38,0.28],
  ['spike',0.05,1.4,-0.5]
];
const RIB=[0,-0.85,0], BASE=[0,-1.5,0];
const flowers=LAYOUT.map((d,i)=>{
  const type=d[0], tip=[d[1],d[2],d[3]];
  const f={type,i,tip,var:d[4]||0,ph:rnd()*6.28,rot:rnd()*6.28,
    ts:0.25+i*0.2, sd:1.7, tb:0, bd:2.2+rnd()*0.8,
    leafT:0.3+rnd()*0.25, leafA:rnd()*6.28, leafOn:rnd()<0.7, wx:0,wz:0,wa:0};
  { const wang=rnd()*6.283; f.wx=Math.cos(wang); f.wz=Math.sin(wang); f.wa=0.05+rnd()*0.06; }
  f.tb=f.ts+1.35;
  const k=0.35;
  f.p0=BASE; f.p1=[0,-1.0,0];
  f.p2=[RIB[0]+(tip[0]-RIB[0])*k, RIB[1]+(tip[1]-RIB[1])*k, RIB[2]+(tip[2]-RIB[2])*k];
  f.q2=[0,0,0]; f.q3=[0,0,0];
  f.spec=TYPES[type]||null;
  if(f.spec){
    let pA=f.spec.pA,pB=f.spec.pB,pC=f.spec.pC;
    if(type==='cosmos'){[pA,pB,pC]=COSMOS_VAR[f.var%4];}

});

/* ---------- вспомогательные ---------- */
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const ease3=x=>1-Math.pow(1-clamp(x,0,1),3);
const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};

/* ---------- лепесток / лист ---------- */
function petal(Cx,Cy,Cz,rx,ry,rz,sx,sy,sz,ax,ay,az,Len,Wd,al,bend,cup,shape,pA,pB,lit,A,G){
  A=A|0; const wide=Wd*Sc>3.5;
  const aL=ax*Lw0+ay*Lw1+az*Lw2, rL=rx*Lw0+ry*Lw1+rz*Lw2, sL=sx*Lw0+sy*Lw1+sz*Lw2;
  const nu=clamp(Math.ceil(Len*Sc*2.2),5,130), nv=clamp(Math.ceil(2*Wd*Sc*2.2),3,110);
  for(let iu=1;iu<=nu;iu++){
    const u=iu/nu, ang=al+bend*u, sa=Math.sin(ang), ca=Math.cos(ang);
    const rad=Len*u*sa, up=Len*u*ca;
    const pw=Wd*Math.pow(Math.sin(Math.PI*Math.pow(u,shape)),0.65);
    const nx=ax*sa-rx*ca, ny=ay*sa-ry*ca, nz=az*sa-rz*ca;
    const nL=sa*aL-ca*rL;
    const bx=Cx+rx*rad+ax*up, by=Cy+ry*rad+ay*up, bz=Cz+rz*rad+az*up;
    const pal=u<0.25?pB:pA;
    const grad=0.5+0.5*Math.min(1,u*1.8);
    for(let iv=0;iv<=nv;iv++){
      const v=-1+2*iv/nv, w=pw*v, e=cup*v*v*pw;
      const d=Math.abs(nL+sL*cup*v*0.8);
      const rim=wide&&(Math.abs(v)>0.92||u>0.96);
      let b=lit*(0.55+0.45*grad)*(0.5+0.62*d)*(rim?0.85:1);
      const X=bx+sx*w+nx*e, Y=by+sy*w+ny*e, Z=bz+sz*w+nz*e;
      plot(X,Y,Z,pal,b,rim?Math.min(2,A+1):A,G);
    }
  }
}

function drawFlower(f,t,g){
  // положение головки — конец растущего стебля
  const tt=clamp(g,0.02,1);
  const hs=smooth((g-0.72)/0.28);           // головка «появляется» в конце роста
  if(hs<=0.001) return;
  bezP(f,tt,TMP); const px=TMP[0],py=TMP[1],pz=TMP[2];
  bezD(f,tt,TMP); let ax=TMP[0],ay=TMP[1],az=TMP[2]; let n=Math.hypot(ax,ay,az)||1; ax/=n;ay/=n;az/=n;
  ay+=0.55; n=Math.hypot(ax,ay,az); ax/=n;ay/=n;az/=n;   // головки смотрят чуть выше стебля
  const refY=Math.abs(ay)>0.9;
  let ex,ey,ez; // e1 = ref x a
  if(refY){ex=0;ey=-az;ez=ay; /* cross((1,0,0),a) */ ex=0;ey=-az;ez=ay;} else {ex=ay*0-az*1; ey=az*0-ax*0; ez=ax*1-ay*0; ex=-az;ey=0;ez=ax;}
  n=Math.hypot(ex,ey,ez)||1; ex/=n;ey/=n;ez/=n;
  const fx=ay*ez-az*ey, fy=az*ex-ax*ez, fz=ax*ey-ay*ex; // e2 = a x e1

  if(f.type==='spike'){ drawSpike(f,tt,ax,ay,az,ex,ey,ez,fx,fy,fz,hs); return; }

  const S=f.spec;
  const o0=ease3((t-f.tb)/f.bd);
  const o=clamp(o0+0.025*Math.sin(t*1.3+f.ph)*o0,0,1);
  const sz=S.size*1.0*hs*(0.5+0.5*o);
  // чашелистики
  for(let k=0;k<5;k++){
    const phi=k/5*6.283+f.rot, c=Math.cos(phi), s=Math.sin(phi);
    const rx=ex*c+fx*s, ry=ey*c+fy*s, rz=ez*c+fz*s;
    const sx=-ex*s+fx*c, sy=-ey*s+fy*c, sz2=-ez*s+fz*c;
    petal(px,py,pz,rx,ry,rz,sx,sy,sz2,ax,ay,az,0.13*sz,0.035*sz,0.25+1.8*o,0.2,0.2,1,C.sepal,C.sepal,0.9);
  }
  // лепестки
  for(let ri=0;ri<S.rings.length;ri++){
    const R=S.rings[ri];
    const al=(S.aC+(S.aO-S.aC)*o)*R.as;
    const len=R.l*sz, wd=R.w*sz*(0.7+0.3*o);
    for(let k=0;k<R.n;k++){
      const phi=k/R.n*6.283+R.off+f.rot, c=Math.cos(phi), s=Math.sin(phi);
      const rx=ex*c+fx*s, ry=ey*c+fy*s, rz=ez*c+fz*s;
      const sx=-ex*s+fx*c, sy=-ey*s+fy*c, sz2=-ez*s+fz*c;
      petal(px,py,pz,rx,ry,rz,sx,sy,sz2,ax,ay,az,len,wd,al,S.bend*o,S.cup,S.shape,f.pA,f.pB,(k&1)?0.7:1,0,(k&1)?1:0);
    }
  }
  // сердцевина
  if(o>0.12){
    const R=S.cR*sz*(0.5+0.5*o), dome=S.dome*sz;
    const nr=clamp(Math.ceil(R*Sc*1.8),2,20);
    for(let ir=0;ir<=nr;ir++){
      const rr=ir/nr, cnt=Math.max(1,Math.ceil(rr*2*Math.PI*R*Sc*1.8));
      for(let k=0;k<cnt;k++){
        const th=k/cnt*6.283+rr*3, c=Math.cos(th)*rr*R, s=Math.sin(th)*rr*R, h=dome*(1-rr*rr)+0.01;
        const b=0.65+0.35*Math.sin(th*5+rr*9)*0.5+0.2*(1-rr);
        plot(px+ex*c+fx*s+ax*h, py+ey*c+fy*s+ay*h, pz+ez*c+fz*s+az*h, f.pC, b);
      }
    }
  }
}

function drawSpike(f,tt,ax,ay,az,ex,ey,ez,fx,fy,fz,hs){
  const t0=0.58;
  if(tt<=t0) return;
  const len=Math.hypot(f.tip[0]-f.p2[0],f.tip[1]-f.p2[1],f.tip[2]-f.p2[2])*0.5+0.1;
  const N=clamp(Math.ceil(len*Sc*0.9),8,40);
  const o=ease3((TIME-f.tb)/f.bd);
  for(let k=0;k<N;k++){
    const u=k/(N-1), tk=t0+(tt-t0)*u;
    if(tk>tt) break;
    bezP(f,tk,TMP2); bezD(f,tk,TMP3);
    let tx=TMP3[0],ty=TMP3[1],tz=TMP3[2]; const nn=Math.hypot(tx,ty,tz)||1; tx/=nn;ty/=nn;tz/=nn;
    const rad=0.055*(1-u*0.75)*(0.3+0.7*o)*hs;
    const th=k*2.4+f.rot;
    const cc=Math.cos(th)*rad, ss=Math.sin(th)*rad;
    const cxp=TMP2[0]+ex*cc+fx*ss, cyp=TMP2[1]+ey*cc+fy*ss, czp=TMP2[2]+ez*cc+fz*ss;
    const pal=u<0.5?C.lav:C.lavDeep;
    const m=2;
    for(let j=0;j<=m;j++){
      const q=j/m-0.5;
      for(let l=0;l<3;l++){
        const a2=l*2.09+th, r2=0.022*(0.4+0.6*o);
        plot(cxp+(ex*Math.cos(a2)+fx*Math.sin(a2))*r2+tx*q*0.03, cyp+(ey*Math.cos(a2)+fy*Math.sin(a2))*r2+ty*q*0.03, czp+(ez*Math.cos(a2)+fz*Math.sin(a2))*r2+tz*q*0.03,
             pal, 0.45+0.5*Math.abs(Math.sin(th+q*2)) );
      }
    }
  }
}

/* ---------- кривая стебля ---------- */
const TMP=[0,0,0], TMP2=[0,0,0], TMP3=[0,0,0];
const T1=[0,0,0], T2=[0,0,0];
function bezRaw(f,t,o){
  const u=1-t,a=u*u*u,b=3*u*u*t,c=3*u*t*t,d=t*t*t;
  o[0]=a*f.p0[0]+b*f.p1[0]+c*f.q2[0]+d*f.q3[0];
  o[1]=a*f.p0[1]+b*f.p1[1]+c*f.q2[1]+d*f.q3[1];
  o[2]=a*f.p0[2]+b*f.p1[2]+c*f.q2[2]+d*f.q3[2];
}
// стебель = безье + бегущая волна (на концах волна гасится)
function bezP(f,t,o){
  bezRaw(f,t,o);
  const env=Math.sin(Math.PI*t);
  const w=(Math.sin(t*7.5+f.ph+TIME*1.3)+0.45*Math.sin(t*15+f.ph*2-TIME*1.9))*f.wa*env;
  o[0]+=f.wx*w; o[2]+=f.wz*w; o[1]+=0.25*w*w*8;
}
function bezD(f,t,o){
  const e=0.012, t0=Math.max(0,t-e), t1=Math.min(1,t+e);
  bezP(f,t0,T1); bezP(f,t1,T2);
  o[0]=(T2[0]-T1[0])/(t1-t0); o[1]=(T2[1]-T1[1])/(t1-t0); o[2]=(T2[2]-T1[2])/(t1-t0);
}
function drawStem(f,g){
  if(g<=0) return;
  const N=clamp(Math.ceil(g*3.4*Sc*1.5),6,900);
  for(let k=0;k<=N;k++){
    const t=k/N*g;
    bezP(f,t,TMP);
    const b=0.42+0.2*Math.sin(t*20+f.ph)*0.5+0.2*t;
    plot(TMP[0],TMP[1],TMP[2],C.stem,b,0);
    plot(TMP[0]+0.010,TMP[1],TMP[2]+0.004,C.leaf2,b*0.8,1);
  }
  // листочек на стебле
  if(f.leafOn && g>f.leafT+0.05){
    const s=smooth((g-f.leafT-0.05)/0.3);
    bezP(f,f.leafT,TMP); bezD(f,f.leafT,TMP3);
    const c=Math.cos(f.leafA), si=Math.sin(f.leafA);
    petal(TMP[0],TMP[1],TMP[2], c,0,si, -si,0,c, 0,1,0, 0.42*s,0.05*s, 0.9,0.5,0.25,0.9,C.leaf,C.leaf2,1,1);
  }
}

/* ---------- вьющиеся лозы (струящиеся линии сквозь букет) ---------- */
const vines=[];
for(let i=0;i<9;i++) vines.push({th:i/9*6.283+rnd()*0.5, dir:(i&1)?1:-1, turn:1.6+rnd()*1.4, R:0.9+rnd()*0.5, H:1.2+rnd()*0.6, t0:1.6+i*0.18, ph:rnd()*6.28});
function drawVines(t){

    const gr=ease3((t-v.t0)/2.6); if(gr<=0.01) continue;
    const N=clamp(Math.ceil(gr*3.4*Sc*1.3),8,700);
    for(let k=0;k<=N;k++){
      const u=k/N*gr;
      const r=0.1+v.R*Math.pow(u,0.85);
      const th=v.th+v.dir*(v.turn*u)+0.14*Math.sin(t*1.1+u*5+v.ph)*u;
      const y=-0.8+v.H*Math.pow(u,0.9)+0.05*Math.sin(t*1.3+u*7+v.ph)*u;

    for(const uu of [0.28,0.5,0.72]){

      const th=v.th+v.dir*(v.turn*uu), r=0.1+v.R*Math.pow(uu,0.85), y=-0.8+v.H*Math.pow(uu,0.9);
      const c=Math.cos(th), si=Math.sin(th), s2=smooth((gr-uu)/0.25);
      petal(r*c,y,r*si, c,0,si, -si,0,c, 0,1,0, 0.17*s2,0.045*s2, 1.05,0.5,0.2,0.9,C.leaf,C.leaf2,1,1);
    }
  }
}

function drawRibbon(t){
  const s=smooth((t-0.35)/0.8); if(s<=0) return;
  const R=0.13, y0=-0.92, hh=0.16*s;
  const nT=clamp(Math.ceil(2*Math.PI*R*Sc*1.8),12,200), nY=clamp(Math.ceil(hh*Sc*1.8),2,30);
  for(let i=0;i<nT;i++){
    const th=i/nT*6.283, c=Math.cos(th), s2=Math.sin(th);
    const d=Math.max(0,c*Lw0+s2*Lw2);
    for(let j=0;j<=nY;j++){
      plot(c*R, y0+hh*j/nY, s2*R, C.ribbon, 0.35+0.75*d+0.12*Math.sin(th*7));
    }
  }
  // бант и хвосты
  if(t>0.9){
    const bs=smooth((t-0.9)/0.8);
    for(const sg of [-1,1]){
      // петли
      petal(0,-0.84,0.13, sg,0.15,0, 0,0,1, 0,1,0, 0.2*bs,0.07*bs, 1.15,0.5,0.1,1,C.ribbon,C.ribbon,1);
      // хвосты
      petal(0,-0.86,0.13, sg*0.5,0,0.3, 0,0.9,0, 0,-1,0, 0.46*bs,0.045*bs, 0.45,0.35,0,1,C.ribbon,C.ribbon,1);
    }
  }
}

/* ---------- автокачество: если кадры долгие — символы крупнее, если быстро — мельче ---------- */
let adAcc=0, adN=0, adCool=0;
function adapt(dt){
  if(QS.get('q')) return;
  adAcc+=dt; adN++; adCool-=dt;
  if(adAcc<1) return;
  const avg=adAcc/adN; adAcc=0; adN=0;
  if(adCool>0) return;
  if(avg>0.030 && QUAL>0.45){ QUAL=Math.max(0.45,QUAL*0.85); adCool=1.5; resize(); }
  else if(avg<0.017 && QUAL<1){ QUAL=Math.min(1,QUAL*1.06); adCool=5; resize(); }
}

/* ---------- главный цикл ---------- */
let last=performance.now();
function frame(now){
  const __t0=performance.now();
  const dt=(FREEZE||!READY)?0:Math.min(0.25,(now-last)/1000); last=now;
  TIME+=dt; idleT+=dt;
  if(!FREEZE) adapt(dt);
  if(ptrs.size===0){
    yaw+=yawV*dt;
    const target=CONFIG.autoSpin*(TIME<5?1.6:1);
    yawV+=(target-yawV)*Math.min(1,dt*0.9);
    if(idleT>3) pitch+=(PITCH0-pitch)*Math.min(1,dt*0.8);
  }
  setCamera();
  zb.fill(INF);
  drawStars(TIME);

  // ветер
  for(const f of flowers){
    const sw=Math.sin(TIME*1.2+f.ph)*0.035, sw2=Math.cos(TIME*0.9+f.ph*1.3)*0.03;
    f.q3[0]=f.tip[0]+sw; f.q3[1]=f.tip[1]; f.q3[2]=f.tip[2]+sw2;
    f.q2[0]=f.p2[0]+sw*0.5; f.q2[1]=f.p2[1]; f.q2[2]=f.p2[2]+sw2*0.5;
  }
  drawRibbon(TIME);
  drawLeaves(TIME);
  drawVines(TIME);
  for(const f of flowers){
    const g=ease3((TIME-f.ts)/f.sd);
    drawStem(f,g);
    drawFlower(f,TIME,g);
  }
  drawParts(TIME,dt);

  // вывод
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  head.fill(-1);
  const n=cols*rows;
  for(let i=0;i<n;i++){ if(zb[i]<INF){ const p=cellPal[i]; nxt[i]=head[p]; head[p]=i; } }
  for(let p=0;p<head.length;p++){
    let i=head[p]; if(i<0) continue;
    const pl=(p/3)|0;
    ctx.globalAlpha=ALPHAS[p%3];
    ctx.fillStyle=PAL[(pl/LV)|0][pl%LV];
    while(i>=0){
      ctx.fillText(RAMP[cellCh[i]], (i%cols)*cw, ((i/cols)|0)*ch);
      i=nxt[i];
    }
  }
  ctx.globalAlpha=1;
  if(QS.get('dbg')==='1'){ const m=performance.now()-__t0; window.__ms=(window.__ms||m)*0.9+m*0.1; window.__cells=cols+'x'+rows; }
  requestAnimationFrame(frame);
}
addEventListener('resize',resize);
resize();
requestAnimationFrame(frame);
})();
</script>
<script>
(()=>{
const INTRO=5.6, ASP=1.85, END=6.4;
const cvT=document.createElement('canvas');
cvT.style.cssText='position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:5';
document.body.appendChild(cvT); const g=cvT.getContext('2d');
let layer=null,dpr=1,W=0,H=0,cwT=4,chT=7,fsT=7,colsT=0,rowsT=0,rMin=0,rMax=1,cells=[];
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const hash=(a,b)=>{let h=(Math.imul(a|0,374761393)+Math.imul(b|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const STOPS=['#D52D00','#EF7627','#FF9A56','#FFFFFF','#D162A4','#B55690','#A30262'].map(hex);   // lesbian flag
function grad(t,k){ t=clamp(t,0,0.9999)*(STOPS.length-1); const i=t|0,f=t-i,a=STOPS[i],b=STOPS[i+1];
  return 'rgb('+[0,1,2].map(j=>clamp(((a[j]+(b[j]-a[j])*f)*k)|0,0,255)).join(',')+')'; }
const FONT='ui-monospace,Menlo,Consolas,"Courier New",monospace';

function build(){
  dpr=Math.min(devicePixelRatio||1,2); W=innerWidth||document.documentElement.clientWidth||360; H=innerHeight||document.documentElement.clientHeight||640;
  cvT.width=W*dpr; cvT.height=H*dpr;
  cwT=W<600?clamp(W/230,1.6,3):clamp(W/300,2.6,5); chT=cwT*ASP; fsT=cwT/0.6;
  g.font='bold '+fsT+'px '+FONT; const m0=g.measureText('0').width||fsT*0.6; fsT*=cwT/m0;
  g.font='bold '+fsT+'px '+FONT; g.textBaseline='top';
  colsT=Math.floor(W/cwT); rowsT=Math.floor(H/chT);
  const mc=document.createElement('canvas'); mc.width=colsT; mc.height=rowsT;
  const m=mc.getContext('2d'); m.setTransform(1,0,0,1/ASP,0,0);
  const lines=['Happy','Anniversary'], fam='Pacifico,"Lobster","Segoe Script","Brush Script MT",cursive';
  m.font='400 100px '+fam; const wmax=Math.max(...lines.map(l=>m.measureText(l).width));
  const narrow=W<600; const S=100*colsT*(narrow?0.95:0.84)/wmax; m.font='400 '+S+'px '+fam; m.textAlign='center'; m.textBaseline='middle'; m.fillStyle='#fff';
  const cyU=rowsT*0.46*ASP;
  if(narrow){ m.strokeStyle='#fff'; m.lineWidth=S*0.03; m.lineJoin='round'; m.strokeText(lines[0],colsT/2,cyU-S*0.74); m.strokeText(lines[1],colsT/2,cyU+S*0.66); }
  m.fillText(lines[0],colsT/2,cyU-S*0.74); m.fillText(lines[1],colsT/2,cyU+S*0.66);
  const d=m.getImageData(0,0,colsT,rowsT).data, on=(c,r)=>c>=0&&r>=0&&c<colsT&&r<rowsT&&d[(r*colsT+c)*4+3]>110;
  cells=[]; rMin=1e9; rMax=-1e9;
  for(let r=0;r<rowsT;r++) for(let c=0;c<colsT;c++){
    if(!on(c,r)) continue;
    const edge=!(on(c-1,r)&&on(c+1,r)&&on(c,r-1)&&on(c,r+1));
    const rn=hash(c,r), rn2=hash(r+91,c+17);
    cells.push({c,r,x:c*cwT,y:r*chT,edge,rn,rn2,ch:edge?'@':'8#0'[(rn*3)|0],col:'#fff'});
    rMin=Math.min(rMin,r); rMax=Math.max(rMax,r);
  }
  // градиент по цветам флага слева направо по всей надписи
  let cMin=1e9,cMax=-1e9; for(const q of cells){ if(q.c<cMin)cMin=q.c; if(q.c>cMax)cMax=q.c; }
  for(const q of cells){
    const t=(q.c-cMin)/Math.max(1,cMax-cMin);
    q.col=grad(t,q.edge?1.1:0.95);
  }
  // вся надпись один раз рисуется в отдельный слой — дальше она проявляется одним вызовом drawImage
  layer=document.createElement('canvas'); layer.width=cvT.width; layer.height=cvT.height;
  const lg=layer.getContext('2d'); lg.setTransform(dpr,0,0,dpr,0,0); lg.font='bold '+fsT+'px '+FONT; lg.textBaseline='top';
  for(const q of cells){ lg.fillStyle=q.col; lg.fillText(q.ch,q.x,q.y); }
}
build(); addEventListener('resize',build);
{ let fin=false; const go=()=>{ if(fin) return; fin=true; build(); if(window.__bqReady) window.__bqReady(); };
  setTimeout(go,1800);
  if(document.fonts&&document.fonts.load) document.fonts.load('100px Pacifico','Happy Anniversary').then(go,go); else go(); }


// 4 — ИСКРЫ: искры слетаются в буквы (рисуются квадратиками), потом проявляется готовый слой надписи;
//     в конце слой гаснет, и искры разлетаются к месту, где вырастет букет
const SPC=['#FF9A56','#FFFFFF','#D162A4','#EF7627','#FFFFFF'], BIN=[0.25,0.5,0.75,1];
const buckets=[]; for(let i=0;i<SPC.length*4;i++) buckets.push([]);
function add(ci,a,x,y){ buckets[ci*4+(a>0.75?3:a>0.5?2:a>0.25?1:0)].push(x,y); }
function frame(){
  requestAnimationFrame(frame);
  const t=(window.BQ?window.BQ.time():0)+INTRO;
  g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,cvT.width,cvT.height);
  if(t<0||t>END||!layer) return;
  // слой с надписью: проявляется 2.0–2.9 с, гаснет 4.2–4.7 с
  const la=clamp((t-2.0)/0.9,0,1)*(t<4.2?1:clamp(1-(t-4.2)/0.5,0,1));
  if(la>0.01){ g.globalAlpha=la; g.drawImage(layer,0,0); g.globalAlpha=1; }
  const bx=W/2, by=H*0.6, hw=Math.hypot(W/2,H/2);
  for(let i=0;i<cells.length;i++){
    const c=cells[i];
    const delay=c.rn2*1.3, dur=1.1+c.rn*0.65;
    let x,y,a,ci=(c.rn*4)|0;
    if(t<4.2){
      if(t<delay) continue;
      const u=clamp((t-delay)/dur,0,1);
      if(u<1){
        const e=1-Math.pow(1-u,3), a0=c.rn*6.283, sx=W/2+Math.cos(a0)*W*0.62, sy=H*0.46+Math.sin(a0)*H*0.62;
        x=sx+(c.x-sx)*e+Math.sin(u*Math.PI)*(c.rn2-0.5)*160; y=sy+(c.y-sy)*e-Math.sin(u*Math.PI)*60*c.rn; a=0.35+0.65*u;
      } else { x=c.x; y=c.y; a=1-la; if(t-delay-dur<0.28){ ci=4; a=1; } }
    } else {
      const dist=Math.hypot(c.x-bx,(c.y-by)*1.4)/hw, tD=4.2+dist*0.9+c.rn*0.3;
      if(t<tD){ x=c.x; y=c.y; a=clamp((t-4.2)/0.4,0,1)*0.9; }
      else { const u2=clamp((t-tD)/1.3,0,1), e2=u2*u2*(3-2*u2);
        x=c.x+(bx-c.x)*e2+Math.sin(u2*Math.PI)*(c.rn-0.5)*120; y=c.y+(by-c.y)*e2-Math.sin(u2*Math.PI)*50*c.rn2; a=1-u2*u2; }
    }
    if(a>0.05) add(ci,a,x,y);
  }
  const sz=Math.max(1.6,cwT*dpr*0.55), off=cwT*dpr*0.2;
  for(let b=0;b<buckets.length;b++){
    const arr=buckets[b]; if(!arr.length) continue;
    g.fillStyle=SPC[b>>2]; g.globalAlpha=BIN[b&3];
    for(let k=0;k<arr.length;k+=2) g.fillRect(arr[k]*dpr+off, arr[k+1]*dpr+off, sz, sz);
    arr.length=0;
  }
  g.globalAlpha=1;
}
requestAnimationFrame(frame);
})();
</script>
